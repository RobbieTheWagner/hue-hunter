name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      # --ignore-scripts skips the postinstall Rust build, which linting doesn't need
      - run: pnpm install --ignore-scripts
      - run: pnpm lint
